<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d20" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="purpleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cyberRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGlow)" />
  
  <!-- Outer glowing rings -->
  <circle cx="200" cy="185" r="130" stroke="url(#purpleCyan)" stroke-width="2.5" fill="none" opacity="0.6" stroke-dasharray="8 6" />
  <circle cx="200" cy="185" r="145" stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.3" filter="url(#glow)" />

  <!-- Avatar body silhouette -->
  <path d="M120 330 C120 270, 150 250, 200 250 C250 250, 280 270, 280 330 Z" fill="#1e293b" />
  <path d="M135 330 C135 280, 160 262, 200 262 C240 262, 265 280, 265 330 Z" fill="#0f172a" />
  
  <!-- Collar / Cyber details -->
  <path d="M175 260 L200 285 L225 260" stroke="url(#purpleCyan)" stroke-width="3" fill="none" stroke-linecap="round" />
  <circle cx="200" cy="290" r="3" fill="#06b6d4" />

  <!-- Neck -->
  <rect x="185" y="210" width="30" height="45" rx="6" fill="#334155" />

  <!-- Head -->
  <rect x="155" y="115" width="90" height="105" rx="42" fill="#334155" />
  
  <!-- Stylish hair / tech cap -->
  <path d="M150 145 C150 95, 250 95, 250 145 C240 120, 220 110, 200 110 C175 110, 160 125, 150 145 Z" fill="#0f172a" />
  <path d="M152 135 C165 105, 205 100, 245 125" stroke="url(#purpleCyan)" stroke-width="2" fill="none" />

  <!-- Futuristic Cyber Glasses / Visor -->
  <rect x="160" y="150" width="80" height="26" rx="8" fill="#090d20" stroke="url(#cyberRing)" stroke-width="2" filter="url(#glow)" />
  <path d="M165 163 L235 163" stroke="#00f5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <circle cx="175" cy="163" r="2" fill="#ffffff" />
  <circle cx="225" cy="163" r="2" fill="#ffffff" />

  <!-- Code symbol overlay -->
  <text x="200" y="365" font-family="'JetBrains Mono', monospace" font-size="14" fill="#a855f7" text-anchor="middle" font-weight="600" opacity="0.9">&lt;Vedant Deshmukh /&gt;</text>
</svg>

